<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connexion · Radar Immo</title>
<link rel="icon" href="../icons/icon32.png">
<link rel="stylesheet" href="../dashboard/theme.css">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);padding:16px;box-sizing:border-box}
  .card{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow-sm);text-align:center}
  .card img{width:48px;height:48px;border-radius:12px}
  h1{font-size:19px;margin:14px 0 8px}
  p{margin:0 0 18px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <img src="../icons/icon48.png" alt="">
  <h1 id="title">Connexion en cours…</h1>
  <p id="msg">Vérification de ton compte.</p>
  <button class="btn primary" id="dash" hidden>Ouvrir le tableau de bord</button>
</main>
<script src="../lib/cloud.js"></script>
<script src="callback.js"></script>
</body>
</html>
