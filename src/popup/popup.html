<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Immo</title>
<link rel="stylesheet" href="../dashboard/theme.css">
<style>
  body{width:360px;margin:0;font-size:14px;background:var(--bg)}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px}
  header img{width:28px;height:28px;border-radius:8px}
  header h1{font-size:15px}
  #crit{font-size:12px;line-height:1.3}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin:0 12px 10px;padding:14px;box-shadow:var(--shadow-sm)}
  .top{display:flex;gap:12px;align-items:center}
  .facts{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .checks{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
  .stats div+div{border-left:1px solid var(--border)}
  .stats b{display:block;font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
  .stats span{font-size:11.5px;color:var(--muted)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 12px 14px}
  .btns .btn{width:100%}
  .btns .wide{grid-column:1/-1}
  .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .session{border-color:#d97706;border-left-width:4px}
  [hidden]{display:none !important}
  /* Sur téléphone, le popup s'ouvre en pleine page */
  @media (pointer:coarse){body{width:auto;max-width:560px;margin:0 auto;font-size:15px}.btn{height:44px;font-size:15px}.card{margin:0 12px 12px}}
</style>
</head>
<body>
<header><img src="../icons/icon48.png" alt=""><div><h1>Radar Immo</h1><div class="m" id="crit"></div></div></header>
<div id="session" class="card session" hidden>
  <b>Session expirée</b>
  <div class="m" style="margin:4px 0 10px">Tes annonces et tes critères ne sont plus synchronisés. Rien n'est perdu : tout repartira dès que tu te reconnectes.</div>
  <button class="btn sm primary" id="relogin">Se reconnecter</button>
</div>
<div id="page" class="card"><div class="m">Analyse de l'onglet…</div></div>
<div class="card">
  <div class="stats">
    <div><b id="nSaved">–</b><span>sauvegardées</span></div>
    <div><b id="nSeen">–</b><span>vues</span></div>
    <div><b id="nDrop">–</b><span>en baisse</span></div>
  </div>
</div>
<div class="btns">
  <button class="btn primary wide" id="openSearches">Lancer mes recherches</button>
  <button class="btn" id="dash">Mes annonces</button>
  <button class="btn" id="compare">Comparer</button>
  <button class="btn ghost wide" id="crits">Modifier mes critères</button>
</div>
<p class="m" id="cloud" style="text-align:center;font-size:12px;margin:-4px 12px 12px"></p>
<script src="../lib/radar.js"></script>
<script src="../lib/cloud.js"></script>
<script src="popup.js"></script>
</body>
</html>
