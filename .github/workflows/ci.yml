name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publication manuelle depuis l'onglet Actions (sur main) : crée le tag v<version de package.json>
  # et la Release, sans avoir à pousser le tag soi-même.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Vérifications, tests unitaires et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: radar-immo-paquets
          path: dist/*.zip
          if-no-files-found: error

  server:
    name: API (tests avec PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  e2e:
    name: Tests de bout en bout (Chromium)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  release:
    name: Publication GitHub
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Adresses du service intégrées aux paquets publiés, si les variables du dépôt sont définies
      # (Settings → Secrets and variables → Actions → Variables). Vides : réglables dans l'extension.
      - run: npm run build
        env:
          RADAR_API_URL: ${{ vars.RADAR_API_URL }}
          RADAR_LOGIN_URL: ${{ vars.RADAR_LOGIN_URL }}
          RADAR_REFRESH_URL: ${{ vars.RADAR_REFRESH_URL }}
      - name: Extraire les notes de version du CHANGELOG
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=$(node -p "require('./package.json').version"); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Pas d'entrée ## [$VERSION] dans CHANGELOG.md"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          files: dist/*.zip
          body_path: release-notes.md
